<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impro</title>
    
    <link rel="stylesheet" href="improStyle.css">
</head>
<body>
    <div id="carteContainer">
        <h1>ImproAssist</h1>
        <button id="boutonCherche">Tirer une carte</button>
        <p id="carteNature"></p>
        <h2 id="carteThème"></h2>
        <p id="carteDurée"></p>
        <p id="carteCatégorie"></p>
    </div>

    <h3>Ajouter une carte:</h3>
    <input type="text" id="carteNatureInsertion" placeholder="Nature">
    <br>
    <input type="text" id="carteThèmeInsertion" placeholder="Thème">
    <br>
    <input type="text" id="carteDuréeInsertion" placeholder="Durée">
    <br>
    <input type="text" id="carteCatégorieInsertion" placeholder="Catégorie">
    <br>
    <br>
    <button id="boutonSoumettre">Soumettre</button>


    <script src="improScript.js"></script>
</body>
</html>
